repos:
  - repo: local
    hooks:
      - id: cookbook-docs
        name: Cookbook links and credential patterns
        entry: uv run --no-sync python scripts/check_docs.py
        language: system
        pass_filenames: false
      - id: cookbook-python
        name: Cookbook Python lint
        entry: uv run --no-sync ruff check
        language: system
        types: [python]
