<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">Terac Cookbook responsibility boundaries</title>
  <desc id="desc">A caller invokes a Recipe, which binds domain inputs and outputs. The shared runner owns identity and lifecycle, saves local checkpoints, and receives synthetic events from replay. A future live provider adapter is shown separately with a dashed boundary. The result returns to the caller for its next decision.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#086e70" stroke-width="1.6"/></marker>
    <marker id="muted-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#687c75" stroke-width="1.6"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #193b3d; }
      .title { font-size: 27px; font-weight: 700; letter-spacing: -.7px; }
      .label { font-size: 20px; font-weight: 700; }
      .detail { font-size: 16px; fill: #546967; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.9px; fill: #086e70; }
      .line { fill: none; stroke: #086e70; stroke-width: 2; marker-end: url(#arrow); }
      .box { fill: #fffef9; stroke: #b5cbc0; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1120" height="600" fill="#fffef9"/>
  <text x="42" y="45" class="eyebrow">TERAC COOKBOOK / LOCAL EXECUTION</text>
  <text x="42" y="85" class="title">Domain meaning stays in the Recipe</text>
  <text x="42" y="113" class="detail">The runner owns progress. Adapters supply events. The caller chooses what comes next.</text>

  <rect x="42" y="174" width="208" height="112" rx="5" class="box"/>
  <text x="62" y="211" class="label">Caller or agent</text>
  <text x="62" y="240" class="detail">Task and presentation</text>
  <text x="62" y="264" class="detail">Python / CLI entrypoint</text>

  <rect x="310" y="174" width="208" height="112" rx="5" class="box"/>
  <text x="330" y="211" class="label">Recipe</text>
  <text x="330" y="240" class="detail">Input / output meaning</text>
  <text x="330" y="264" class="detail">Artifact and scope binding</text>

  <rect x="578" y="174" width="208" height="112" rx="5" fill="#e5efea" stroke="#086e70" stroke-width="1.5"/>
  <text x="598" y="211" class="label">Runner</text>
  <text x="598" y="240" class="detail">Identity and lifecycle</text>
  <text x="598" y="264" class="detail">Explicit progression</text>

  <rect x="846" y="174" width="232" height="112" rx="5" class="box"/>
  <text x="866" y="211" class="label">Replay adapter</text>
  <text x="866" y="240" class="detail">Synthetic events</text>
  <text x="866" y="264" class="detail">No account or expert spend</text>

  <path d="M250 230 H302" class="line"/>
  <path d="M518 230 H570" class="line"/>
  <path d="M786 218 H838" class="line"/>
  <path d="M846 252 H794" class="line"/>

  <rect x="578" y="356" width="208" height="103" rx="5" class="box"/>
  <text x="598" y="393" class="label">Checkpoints</text>
  <text x="598" y="422" class="detail">Local plaintext JSON</text>
  <text x="598" y="446" class="detail">One process at a time</text>
  <path d="M682 286 V348" class="line"/>
  <text x="700" y="326" class="detail">save / reload</text>

  <rect x="846" y="356" width="232" height="103" rx="5" fill="#f7f6f0" stroke="#8da398" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="866" y="393" class="label">Future live adapter</text>
  <text x="866" y="422" class="detail">Verified provider contract</text>
  <text x="866" y="446" class="detail">Separate effect authority</text>
  <path d="M786 270 H812 V406 H838" fill="none" stroke="#687c75" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#muted-arrow)"/>

  <path d="M414 286 V404 H146 V294" class="line"/>
  <text x="64" y="442" class="detail">Validated result returns to the caller</text>
  <text x="64" y="468" class="detail">for explanation, revision or fresh work.</text>

  <path d="M42 514 H1078" stroke="#cedbd4"/>
  <text x="42" y="549" class="detail">Solid: implemented offline boundary</text>
  <path d="M392 544 H432" stroke="#8da398" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="444" y="549" class="detail">Dashed: future provider integration</text>
  <text x="42" y="576" class="detail">Inspection reads saved state. It does not advance replay, wake an agent or approve effects.</text>
</svg>
