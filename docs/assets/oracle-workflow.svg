<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 880" role="img" aria-labelledby="title desc">
  <title id="title">Oracle: four actions and the calling agent's next decision</title>
  <desc id="desc">Start creates a waiting run for an exact GTM brief. Inspect reads any saved phase without advancement. In the default inconclusive case, resume exposes a clarification, respond records an answer, and another resume delivers feedback. Pass and fail cases deliver on first resume. After delivery, the agent may present and continue, revise with no inherited verdict, or start fresh linked work.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#086e70" stroke-width="1.6"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #193b3d; }
      .title { font-size: 27px; font-weight: 700; letter-spacing: -.7px; }
      .label { font-size: 20px; font-weight: 700; }
      .detail { font-size: 16px; fill: #546967; }
      .small { font-size: 14px; fill: #546967; }
      .action { font-size: 15px; fill: #086e70; font-weight: 750; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.9px; fill: #086e70; }
      .line { fill: none; stroke: #086e70; stroke-width: 2; marker-end: url(#arrow); }
      .box { fill: #fffef9; stroke: #b5cbc0; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1120" height="880" fill="#fffef9"/>
  <text x="42" y="45" class="eyebrow">ORACLE / SYNTHETIC REPLAY</text>
  <text x="42" y="85" class="title">Feedback delivered. The next decision is the agent's.</text>
  <text x="42" y="113" class="detail">Fixed scope: buyer and pain · willingness to pay · channel fit</text>

  <rect x="350" y="152" width="332" height="80" rx="5" class="box"/>
  <text x="372" y="185" class="label">Exact GTM brief</text>
  <text x="372" y="212" class="detail">Agent states claims and evidence</text>
  <path d="M516 232 V287" class="line"/>
  <text x="534" y="267" class="action">start</text>

  <rect x="350" y="295" width="332" height="80" rx="5" fill="#e5efea" stroke="#086e70" stroke-width="1.5"/>
  <text x="372" y="328" class="label">Saved waiting run</text>
  <text x="372" y="355" class="detail">Run identity + exact brief binding</text>

  <rect x="770" y="295" width="308" height="110" rx="5" fill="#f7f6f0" stroke="#b5cbc0" stroke-width="1.5"/>
  <text x="792" y="328" class="action">inspect</text>
  <text x="792" y="355" class="detail">Read any saved phase</text>
  <text x="792" y="380" class="detail">No advancement or effect approval</text>
  <path d="M682 335 H762" class="line"/>

  <path d="M516 375 V447" class="line"/>
  <text x="534" y="410" class="action">resume</text>
  <text x="534" y="432" class="small">default inconclusive</text>
  <rect x="350" y="455" width="332" height="80" rx="5" class="box"/>
  <text x="372" y="488" class="label">Clarification pending</text>
  <text x="372" y="515" class="detail">Wait for a nonempty answer</text>

  <path d="M682 495 H924 V582 H690" class="line"/>
  <text x="758" y="463" class="action">respond</text>
  <text x="758" y="486" class="small">Save answer; no next event</text>
  <text x="758" y="535" class="action">resume</text>
  <text x="758" y="558" class="small">Release scripted review</text>

  <rect x="350" y="550" width="332" height="100" rx="5" fill="#e5efea" stroke="#086e70" stroke-width="1.5"/>
  <text x="372" y="584" class="label">Validated feedback</text>
  <text x="372" y="612" class="detail">pass / fail / inconclusive</text>
  <text x="372" y="636" class="small">Delivery succeeds for any valid review</text>

  <path d="M350 335 H290 V600 H342" class="line"/>
  <text x="56" y="410" class="action">resume</text>
  <text x="56" y="437" class="small">pass_with_comments</text>
  <text x="56" y="460" class="small">or fail</text>
  <text x="56" y="496" class="small">First resume delivers</text>
  <text x="56" y="519" class="small">without clarification</text>

  <path d="M516 650 V700" class="line"/>
  <text x="42" y="689" class="eyebrow">CALLING AGENT CHOOSES</text>
  <path d="M516 708 H202 V735" class="line"/>
  <path d="M516 708 V735" class="line"/>
  <path d="M516 708 H886 V735" class="line"/>

  <rect x="42" y="743" width="320" height="88" rx="5" class="box"/>
  <text x="62" y="776" class="label">Present and continue</text>
  <text x="62" y="805" class="detail">Explain advice and limitations</text>
  <rect x="392" y="743" width="300" height="88" rx="5" class="box"/>
  <text x="412" y="776" class="label">Revise the brief</text>
  <text x="412" y="805" class="detail">No inherited recommendation</text>
  <rect x="722" y="743" width="356" height="88" rx="5" class="box"/>
  <text x="742" y="776" class="label">Linked start</text>
  <text x="742" y="805" class="detail">Fresh work; preserve earlier feedback</text>

  <text x="42" y="860" class="small">Scripted content and timing demonstrate the workflow. They do not evaluate arbitrary briefs or establish live expert judgment.</text>
</svg>
