name: Cookbook offline checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'juan/**']

permissions:
  contents: read

concurrency:
  group: cookbook-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install environment tool
        run: python -m pip install uv==0.11.7
      - name: Install locked development environment
        run: uv sync --locked --extra connectors --python ${{ matrix.python }}
      - name: Check documentation and credential patterns
        run: uv run --no-sync python scripts/check_docs.py
      - name: Check generated documentation
        run: uv run --no-sync python scripts/render_docs.py --check
      - name: Test offline caller interfaces
        run: uv run --no-sync python -m pytest -q
      - name: Check source and formatting
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Build package
        run: uv build
      - name: Exercise installed wheel outside checkout
        shell: bash
        run: uv run --no-sync python scripts/smoke_wheel.py --wheel dist/*.whl --with-mcp

  windows-credentials:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install environment tool
        run: python -m pip install uv==0.11.7
      - name: Install locked development environment
        run: uv sync --locked --python 3.12
      - name: Test synthetic credential storage and captured CLI output
        run: uv run --no-sync python -m pytest -q scripts/tests tests/test_oracle.py::test_captured_cli_preserves_unicode_through_all_actions
